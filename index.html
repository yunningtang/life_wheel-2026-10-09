<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#F6F2E9}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>人生转盘</title>
<style>
/* 布局：白纸棋盘上的游戏面板。顶部标题，左侧角色卡（宽屏）/顶部角色卡（手机），分页技能面板，底部 HUD 状态栏；转盘与抉择以抽屉弹出 */
:root{
  --bg:#F6F2E9; --sheet:#FFFDF8; --ink:#1F2433; --muted:#7A7060; --line:#E6DCC8; --line2:#D4C7AC;
  --seal:#D2412F; --seal-d:#A32E1F; --gold:#E09A12; --gold-d:#A9700A; --blue:#2F6FD6; --jade:#2E9B62; --pink:#DE4F86; --violet:#7B5CD6;
  --hl:rgba(210,65,47,.08); --scrim:rgba(31,36,51,.48); --shadow:rgba(90,70,30,.14); --dot:rgba(120,100,60,.13);
  --w1:#D2412F; --w2:#2F6FD6; --w3:#2E9B62; --w4:#D88E0C; --w5:#7B5CD6; --w6:#DE4F86; --w7:#1E8FA3; --w8:#8A5A2E;
  --display:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"Rubik","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16140F; --sheet:#221E17; --ink:#F1E9D7; --muted:#A99B7D; --line:#3A3226; --line2:#4A4032;
  --seal:#F06350; --seal-d:#A8392A; --gold:#F2B640; --gold-d:#A87A1A; --blue:#6E9EF0; --jade:#4CC487; --pink:#F07AA3; --violet:#A08AF0;
  --hl:rgba(240,99,80,.14); --scrim:rgba(5,4,2,.68); --shadow:rgba(0,0,0,.45); --dot:rgba(255,240,200,.06);
  --w1:#C53E2D; --w2:#2F64C0; --w3:#28885A; --w4:#B9790C; --w5:#6A4FC0; --w6:#C24476; --w7:#1B7E90; --w8:#7A5028;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16140F; --sheet:#221E17; --ink:#F1E9D7; --muted:#A99B7D; --line:#3A3226; --line2:#4A4032;
  --seal:#F06350; --seal-d:#A8392A; --gold:#F2B640; --gold-d:#A87A1A; --blue:#6E9EF0; --jade:#4CC487; --pink:#F07AA3; --violet:#A08AF0;
  --hl:rgba(240,99,80,.14); --scrim:rgba(5,4,2,.68); --shadow:rgba(0,0,0,.45); --dot:rgba(255,240,200,.06);
  --w1:#C53E2D; --w2:#2F64C0; --w3:#28885A; --w4:#B9790C; --w5:#6A4FC0; --w6:#C24476; --w7:#1B7E90; --w8:#7A5028;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i .f{fill:currentColor;stroke:none}
.app{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}
.app.ended{padding-block-end:40px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 顶部 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo .wh{width:42px;height:42px;border-radius:50%;flex:none;background:conic-gradient(var(--w1) 0 25%,var(--w4) 0 50%,var(--w3) 0 75%,var(--w2) 0);border:3px solid var(--ink);position:relative;box-shadow:0 3px 0 var(--ink)}
.logo .wh::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,7vw,40px);line-height:1;margin:0;letter-spacing:.04em}
.kicker{display:block;font-size:11px;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-top:3px}
.fileno{font-family:var(--num);font-size:11px;color:var(--muted);text-align:right;line-height:1.4}
.fileno b{display:block;color:var(--ink);font-size:13px;font-weight:600}
h2{font-family:var(--display);font-weight:900;font-size:24px;margin:0;letter-spacing:.03em;text-wrap:balance}

/* 面板 */
.paper{background:var(--sheet);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);cursor:pointer;font-weight:700;white-space:nowrap;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--seal);border-color:var(--seal-d);color:#fff;box-shadow:0 4px 0 var(--seal-d);font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.06em}
.btn.primary:active:not(:disabled){box-shadow:0 0 0 var(--seal-d);transform:translateY(4px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--line2)}
.btn.big{width:100%;padding:14px;font-size:20px}
.btn.on{background:var(--gold);border-color:var(--gold-d);color:#2a1d00;box-shadow:0 3px 0 var(--gold-d)}
.btn.sm{padding:4px 0;width:36px;font-size:18px;line-height:1.2}

/* 开局 */
.setup{display:grid;gap:18px;max-width:860px;margin-inline:auto}
.idrow{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end;padding:16px}
.f-sur{flex:0 0 88px}.f-name{flex:1 1 150px}.f-g{flex:0 0 auto}
.field{display:grid;gap:4px;min-width:0}
.field label,.lab{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.namebox{display:flex;gap:6px}
.idrow input{flex:1;min-width:0;width:100%;font:700 20px var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line2);border-radius:10px;padding:6px 10px}
.idrow input:focus{outline:none;border-color:var(--seal)}
.surs{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px}
.surs button{border:2px solid var(--line);background:var(--sheet);border-radius:10px;padding:2px 10px;cursor:pointer;font-family:var(--display);font-size:17px}
.surs button[aria-pressed="true"]{border-color:var(--seal);color:var(--seal);background:var(--hl)}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.seg button{border:0;background:var(--sheet);padding:7px 16px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tt span{font-size:13px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{position:relative;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:110px;padding:12px;background:var(--sheet);border:2px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .12s;overflow:hidden;animation:pop .35s both}
.tcard:hover{transform:translateY(-2px)}
.tcard .rar{align-self:flex-start;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--muted);background:var(--bg);border-radius:20px;padding:0 8px}
.tcard b{font-family:var(--display);font-weight:900;font-size:21px;line-height:1.2;letter-spacing:.02em}
.tcard .ds{font-size:12.5px;color:var(--muted);line-height:1.45}
.tcard.r1{border-color:var(--blue);box-shadow:0 4px 0 var(--blue)}
.tcard.r1 .rar{background:var(--blue);color:#fff}
.tcard.r2{border-color:var(--gold);box-shadow:0 4px 0 var(--gold-d);background:linear-gradient(160deg,var(--sheet) 55%,color-mix(in srgb,var(--gold) 22%,var(--sheet)))}
.tcard.r2 .rar{background:var(--gold);color:#2a1d00}
.tcard.r2::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s 1s infinite}
.tcard[aria-pressed="true"]{border-color:var(--seal);box-shadow:0 4px 0 var(--seal-d);transform:translateY(-2px)}
.tcard[aria-pressed="true"]::after{content:"✓";position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--seal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn.primary{flex:1}
.alloc{padding:4px 16px}
.arow{display:grid;grid-template-columns:3.2em auto 2em auto 1fr;align-items:center;gap:8px;padding:10px 0;border-bottom:2px dashed var(--line)}
.arow:last-child{border-bottom:0}
.an{font-family:var(--display);font-size:20px}
.av{font-family:var(--num);font-weight:700;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.abar{height:10px;background:var(--bg);border:2px solid var(--line2);border-radius:8px;overflow:hidden;display:block}
.abar u{display:block;height:100%;background:var(--seal);transition:width .2s}
.ah{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.hist{padding:14px 16px;display:grid;gap:8px}
.hs{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hs b{color:var(--ink);font-family:var(--num);font-weight:700}

/* 角色卡 */
.profile{padding:14px 14px 12px}
.pid{display:flex;align-items:center;gap:12px}
.avatar{position:relative;flex:none;width:58px;height:58px;border-radius:50%;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:26px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.avatar small{position:absolute;right:-8px;bottom:-6px;background:var(--gold);color:#2a1d00;border:2px solid var(--ink);border-radius:20px;font-family:var(--num);font-weight:700;font-size:12px;padding:0 6px;line-height:18px}
.pinfo{min-width:0;flex:1}
.pname{font-family:var(--display);font-size:26px;line-height:1.1;letter-spacing:.03em}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11.5px;border:1.5px solid var(--line2);border-radius:20px;padding:0 8px;color:var(--muted);font-weight:500;white-space:nowrap}
.tag.hot{border-color:var(--seal);color:var(--seal)}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 10px}
.m{min-width:0}
.m .ml{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);font-weight:500}
.m .ml b{font-family:var(--num);color:var(--ink);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.m i{display:block;height:8px;background:var(--bg);border:1.5px solid var(--line2);border-radius:6px;margin-top:3px;overflow:hidden}
.m i u{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.m-blue i u{background:var(--blue)}.m-pink i u{background:var(--pink)}.m-jade i u{background:var(--jade)}.m-gold i u{background:var(--gold)}.m-seal i u{background:var(--seal)}.m-violet i u{background:var(--violet)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0;border-top:2px dashed var(--line);padding-top:9px}
.facts div{min-width:0}
.facts dt{font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.facts dd{margin:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,1fr)}.meters{gap:6px}}

/* 分页 */
.side{display:grid;gap:14px;align-content:start;min-width:0;margin-bottom:12px}
.main{min-width:0}
.side-year{display:none}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:4px;padding:5px;margin:0 0 14px;background:var(--sheet);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;padding:8px 10px;font-family:var(--display);font-size:17px;letter-spacing:.04em;color:var(--muted);cursor:pointer;border-radius:11px;position:relative}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.tabs button i{position:absolute;top:2px;right:4px;font-style:normal;font-family:var(--num);font-size:10px;font-weight:700;background:var(--seal);color:#fff;border-radius:10px;padding:0 5px;line-height:15px}
.panel{display:grid;gap:18px}
.tip{font-size:12.5px;color:var(--muted);margin:0}
.yearcard{padding:12px 14px}
.yc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px dashed var(--line);padding-bottom:6px;margin-bottom:8px}
.yc-h b{font-family:var(--display);font-size:22px;font-weight:900;letter-spacing:.03em}
.yc-h span{font-size:12.5px;color:var(--muted)}
.yearcard p{margin:0 0 4px}
.grp{display:grid;gap:10px}
.sec2{font-family:var(--display);font-weight:900;font-size:21px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;letter-spacing:.03em}
.sec2::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--seal);align-self:center;margin-right:-2px}
.sec2 small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:auto}

/* 技能卡 */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.act{position:relative;text-align:left;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:9px;padding:9px 10px;border:2px solid var(--line);border-radius:14px;background:var(--sheet);cursor:pointer;min-width:0;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .12s}
.act .gl{grid-row:span 2;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;background:var(--c,var(--ink));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.act b{font-size:14.5px;font-weight:700;padding-right:22px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act span{font-size:11.5px;color:var(--muted);line-height:1.35;min-width:0}
.act em{position:absolute;right:7px;top:7px;display:flex;gap:1px;color:var(--gold)}
.act em svg.i{width:12px;height:12px}
.act:hover:not(:disabled){border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.act:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.act:disabled{cursor:not-allowed;opacity:.42;filter:grayscale(.8)}
.up{color:var(--jade)} .dn{color:var(--seal)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{padding:12px 14px;display:grid;gap:9px;align-content:start;min-width:0}
.card.gone{opacity:.55;filter:grayscale(.7)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ch b{font-family:var(--display);font-size:21px;font-weight:900;letter-spacing:.02em}
.ch span{font-size:12px;color:var(--muted);text-align:right}
.cs{font-size:13px;color:var(--muted);margin:0}
.bars{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border:2px solid var(--line2);border-radius:10px;background:var(--sheet);cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 var(--line2);transition:transform .08s}
.mini:hover:not(:disabled){border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.mini:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.mini:disabled{opacity:.4;cursor:not-allowed}
.mini em{display:inline-flex;color:var(--gold)}
.mini em svg.i{width:11px;height:11px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;margin:0}
.sum div{min-width:0}
.sum dt{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.sum dd{margin:0;font-family:var(--num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:460px){.sum{grid-template-columns:repeat(2,1fr)}}
.rows{padding:2px 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;padding:11px 0;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .ri{min-width:0;flex:1 1 170px}
.row .ri b{display:block}
.row .ri span{font-size:12.5px;color:var(--muted)}
.empty{padding:14px;color:var(--muted);font-size:13.5px;margin:0}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:0}
.kv dt{font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:700}
.kv dd{margin:0;font-family:var(--num);font-weight:700;font-size:16px}

/* 地图 */
.mapgrid{display:grid;gap:14px}
.mapwrap{padding:8px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap .grid{stroke:var(--line);stroke-width:.6}
.mapwrap .coast{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:3 3;opacity:.6}
.mapwrap .sea{fill:var(--blue);opacity:.6;font-size:10px;letter-spacing:.3em}
.mapwrap .nd{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.mapwrap .nd.t1{stroke-width:2.6}
.mapwrap .nd.cur{fill:var(--seal);stroke:var(--seal-d)}
.mapwrap .ring{fill:none;stroke:var(--gold);stroke-width:2.5}
.mapwrap .lb{fill:var(--ink);font-size:11px;font-weight:700}
.mapwrap .own{fill:var(--jade)}
.mapwrap .kid{fill:var(--gold)}
.mapwrap .link{stroke:var(--seal);stroke-width:1.2;stroke-dasharray:2 3;opacity:.7}
.mapwrap .hit{fill:transparent;cursor:pointer}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:2px 8px 6px}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.cityinfo{padding:14px;display:grid;gap:12px}

/* 生平 */
.log{list-style:none;margin:0;padding:0}
.yr{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line)}
.yr .age{font-family:var(--display);font-size:26px;line-height:1.1;text-align:right;font-variant-numeric:tabular-nums}
.yr .age small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:1px}
.yr .age small.y{display:block;font-family:var(--num);font-size:10.5px;margin:0;line-height:1.3}
.lines{min-width:0}
.lines p{margin:0 0 3px}
.lines p:last-child{margin:0}
.fx{font-style:normal;font-size:12px;white-space:nowrap}
.fx span{margin-left:4px;padding:0 6px;border-radius:10px;background:var(--bg);font-weight:700}
.dim{color:var(--muted);font-size:13.5px}
.ms{font-weight:700}
.bad{color:var(--seal)}
.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);padding:2px 8px;border-radius:8px;font-weight:700}
.death{font-family:var(--display);font-size:22px;color:var(--seal)}
.quiet{color:var(--muted);font-size:13px}

/* 底部 HUD */
.hud{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.hud-in{pointer-events:auto;max-width:1128px;margin:0 auto;background:var(--sheet);border:2px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink),0 12px 30px -10px var(--shadow);padding:8px;display:grid;gap:8px}
.hud-stats{display:flex;gap:6px;align-items:center;min-width:0}
.hs-age{flex:none;display:flex;align-items:baseline;gap:2px;background:var(--ink);color:var(--sheet);border-radius:12px;padding:3px 10px}
.hs-age b{font-family:var(--num);font-size:22px;font-weight:700;line-height:1.1}
.hs-age span{font-size:11px}
.chipx{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:4px 6px;transition:background .3s,border-color .3s}
.chipx b{font-family:var(--num);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chipx .lbl{display:none;font-size:11px;color:var(--muted)}
.chipx svg.i{width:16px;height:16px}
.chipx.c-cash svg{color:var(--gold)}.chipx.c-hp svg{color:var(--seal)}.chipx.c-happy svg{color:var(--jade)}.chipx.c-en svg{color:var(--gold)}
.chipx.flash-up{background:color-mix(in srgb,var(--jade) 20%,var(--bg));border-color:var(--jade)}
.chipx.flash-dn{background:color-mix(in srgb,var(--seal) 18%,var(--bg));border-color:var(--seal)}
.pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-family:var(--num);font-weight:700;font-size:13px;pointer-events:none;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
.pop.up{color:var(--jade)}.pop.dn{color:var(--seal)}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:14px;border-radius:3px;border:2px solid var(--gold-d);background:transparent}
.pips i.on{background:var(--gold)}
.hud-btns{display:flex;gap:6px;align-items:stretch}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;padding:0 10px;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.ib:active{transform:translateY(3px);box-shadow:none}
.ib.on{background:var(--gold);border-color:var(--gold-d);box-shadow:0 3px 0 var(--gold-d);color:#2a1d00}
.ib.warn{background:var(--seal);border-color:var(--seal-d);color:#fff;box-shadow:0 3px 0 var(--seal-d)}
.hud-btns .btn.primary{flex:1;padding:11px 14px;font-size:21px;border-radius:14px}
.hud-btns .btn.primary svg.i{width:18px;height:18px}
@media (min-width:760px){
  .hud-in{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:8px 10px}
  .chipx .lbl{display:inline}
  .hud-btns .btn.primary{min-width:190px}
}

/* 过年提示 */
.ytoast{position:fixed;left:50%;top:38%;z-index:30;transform:translate(-50%,-50%);pointer-events:none;text-align:center;background:var(--sheet);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:10px 26px 12px;animation:ytoast .95s ease-out forwards}
.ytoast b{display:block;font-family:var(--display);font-size:54px;line-height:1;color:var(--seal)}
.ytoast span{font-size:13px;color:var(--muted);font-weight:700}

/* 抽屉 */
.ov{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{width:min(560px,100%);max-height:94vh;max-height:94dvh;overflow:auto;background:var(--sheet);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,1.3,.4,1)}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:22px;border-bottom:2px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:22px}}
.sk{display:inline-block;margin:0;font-size:11px;letter-spacing:.2em;color:#fff;background:var(--seal);border-radius:20px;padding:1px 10px;font-weight:700}
.sheet h3{font-family:var(--display);font-weight:900;font-size:28px;margin:6px 0 2px;letter-spacing:.03em;text-wrap:balance}
.note{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.wheelbox{position:relative;margin:18px auto 16px;width:max-content;max-width:100%}
.wheelbox canvas{display:block;max-width:100%;border-radius:50%;box-shadow:0 0 0 4px var(--ink),0 0 0 9px var(--gold),0 0 0 11px var(--ink),0 8px 0 9px var(--ink)}
.pointer{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid var(--seal);z-index:2;filter:drop-shadow(0 2px 0 var(--ink))}
.hub{position:absolute;left:50%;top:50%;width:56px;height:56px;transform:translate(-50%,-50%);border-radius:50%;background:var(--sheet);border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:26px;color:var(--seal)}
.res{border:2px solid var(--seal);border-radius:14px;padding:10px 12px;margin-bottom:12px;background:var(--hl);animation:pop .35s both}
.res b{font-family:var(--display);font-weight:900;font-size:28px;color:var(--seal);display:block;line-height:1.2;margin-top:4px}
.res p{margin:2px 0 0;font-size:13.5px}
.legend{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px}
.legend li{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 8px;border-radius:8px;min-width:0}
.legend li i{width:12px;height:12px;border-radius:4px;flex:none}
.legend li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend li b{font-family:var(--num);font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.legend li.hit{background:var(--hl);font-weight:700}
.legend li.hit b{color:var(--seal)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--sheet);cursor:pointer;display:grid;gap:2px;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.opt b{font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){background:var(--hl)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.opt:disabled{opacity:.42;cursor:not-allowed;box-shadow:0 2px 0 var(--line2);border-color:var(--line2)}

/* 结算 */
.report{padding:20px 16px;margin-bottom:18px;position:relative}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rhead h2{font-size:32px;margin-top:6px}
.grade{flex:none;width:96px;height:96px;border:4px solid var(--seal);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--seal);transform:rotate(-10deg);font-family:var(--display);line-height:1;background:var(--hl);animation:stamp .5s .2s both}
.grade b{font-size:34px;font-weight:900;display:block}
.grade span{font-size:13px;display:block;margin-top:2px}
.epi{font-family:var(--display);font-size:20px;margin:12px 0 14px;padding:10px 14px;border-radius:12px;background:var(--bg);letter-spacing:.02em}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin:0 0 14px}
.rgrid dt{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.rgrid dd{margin:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;border:2px solid var(--line2);padding:1px 9px;border-radius:20px;font-weight:700}
.chip.r1{border-color:var(--blue);color:var(--blue)} .chip.r2{border-color:var(--gold);color:var(--gold-d)}
.chip.lock{opacity:.5;border-style:dashed;font-weight:500}
.chip.ach{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.chip sup{color:var(--seal);font-size:10px;margin-left:2px}
.report .lab{display:block;margin-top:14px}
.chart{margin:6px 0 4px;min-width:0}
.chart canvas{display:block;max-width:100%}
.newrec{display:inline-block;margin-top:8px}
.sec{font-family:var(--display);font-weight:900;font-size:22px;margin:8px 0 6px;letter-spacing:.03em}
.dyn{display:grid;gap:2px;margin-top:6px}
.dyn div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;border-bottom:2px dashed var(--line);padding:5px 0}
.heirs{display:grid;gap:8px;margin-top:8px}
.app.ended main{max-width:860px;margin-inline:auto}

@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
@keyframes ytoast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}
@keyframes shine{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
@keyframes stamp{from{transform:rotate(-10deg) scale(2.2);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}

@media (min-width:960px){
  .game{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
  .side{position:sticky;top:12px;max-height:calc(100vh - 130px);overflow:auto;margin-bottom:0;padding:2px 2px 6px}
  .side .facts{grid-template-columns:repeat(2,1fr)}
  .side-year{display:block}
  .yc-main{display:none}
  .mapgrid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
  .top{margin-bottom:20px}
}


h1,h2,.pname,.ch b,.sec2,.yc-h b,.tabs button,.an,.avatar,.surs button,.act .gl,.hub,.yr .age,.epi,.sec,.tcard b,.sheet h3,.res b,.lvn{font-weight:900;letter-spacing:.01em}
.tabs button{font-size:15.5px}.tcard b{font-size:19px}.pname{font-size:23px}.sheet h3{font-size:25px}.res b{font-size:25px}
.who{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:2px solid var(--line);border-radius:30px;background:var(--sheet);min-width:0;max-width:56vw;margin-left:auto}
.who img{width:30px;height:30px;border-radius:50%;flex:none;background:var(--bg)}
.who div{display:grid;line-height:1.25;min-width:0;padding-left:6px}
.who img+div{padding-left:0}
.who b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11px;color:var(--muted);white-space:nowrap}
.who.on{border-color:var(--jade)}.who.on span{color:var(--jade);font-weight:700}
@media (max-width:640px){.fileno{display:none}.kicker{display:none}}
.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:26px 32px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--bg)}
.board li.me{outline:2px solid var(--gold)}
.board .rk{font-family:var(--num);font-weight:700;text-align:center;font-size:16px}
.board li:nth-child(1) .rk{color:var(--gold-d)}.board li:nth-child(2) .rk{color:var(--blue)}.board li:nth-child(3) .rk{color:var(--seal)}
.board img{width:32px;height:32px;border-radius:50%;background:var(--line)}
.board .bn{min-width:0;display:grid;line-height:1.3}
.board .bn b,.board .bn small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .bn small{font-size:11.5px;color:var(--muted)}
.board .bs{display:grid;justify-items:end;line-height:1.1;font-size:12px;font-weight:900;color:var(--seal)}
.board .bs b{font-family:var(--num);font-size:18px;color:var(--ink)}
.mottos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mottos button{text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--sheet);cursor:pointer;display:grid;gap:2px;box-shadow:0 3px 0 var(--line)}
.mottos button b{font-size:17px;font-weight:900}
.mottos button span{font-size:12px;color:var(--muted)}
.mottos button[aria-pressed="true"]{border-color:var(--seal);box-shadow:0 3px 0 var(--seal-d);background:var(--hl)}
.lv{display:flex;align-items:center;gap:12px}
.lvn{flex:none;font-size:16px;color:#fff;background:var(--gold-d);border-radius:10px;padding:4px 10px}
.tree{padding:4px 14px}
.tn{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:2px dashed var(--line)}
.tn:last-child{border-bottom:0}
.tn .gb{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;background:var(--bg);border:2px solid var(--line2)}
.tn.live .gb{background:var(--seal);border-color:var(--seal-d);color:#fff}
.tn div{display:grid;min-width:0}.tn span{font-size:12.5px;color:var(--muted)}
.spark{display:block;width:100%;height:40px}
.spark polyline{fill:none;stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.spark .u{stroke:var(--jade)}.spark .d{stroke:var(--seal)}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font-family:var(--num);font-size:22px}
.price span{font-family:var(--num);font-weight:700;font-size:13px}
.regime{display:inline-block;border-radius:20px;padding:0 10px;font-family:var(--body);font-weight:900;font-size:14px;color:#fff}
.regime.bull{background:var(--jade)}.regime.bear{background:var(--seal)}.regime.flat{background:var(--muted)}
.ovs{padding:4px 8px 8px;display:grid;gap:6px}
.mini.sel{border-color:var(--seal);color:var(--seal);background:var(--hl)}
@media (max-width:560px){.tabs svg.i{display:none}.tabs button{padding:8px 8px;font-size:14.5px}}

.sh-top{display:flex;align-items:center;gap:10px}
.backbtn{border:2px solid var(--ink);background:var(--sheet);border-radius:10px;padding:3px 12px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.backbtn:active{transform:translateY(2px);box-shadow:none}

/* 皮肤：覆盖主题 token，放在最后以压过系统深色 */
:root[data-skin="night"]{--bg:#15161C;--sheet:#1F2129;--ink:#EEF0F6;--muted:#9AA0B3;--line:#343745;--line2:#444859;--seal:#FF6B5B;--seal-d:#B23A2E;--gold:#FFC75A;--gold-d:#B8862A;--blue:#7AA7FF;--jade:#4FD39A;--pink:#FF86B2;--violet:#B39CFF;--hl:rgba(255,107,91,.14);--scrim:rgba(0,0,0,.7);--shadow:rgba(0,0,0,.5);--dot:rgba(255,255,255,.05);color-scheme:dark}
:root[data-skin="bamboo"]{--bg:#EEF4EA;--sheet:#FAFDF7;--ink:#1F3324;--muted:#6B7F6E;--line:#D3E0CF;--line2:#B9CCB4;--seal:#2F8F5B;--seal-d:#1F6A41;--gold:#D9A621;--gold-d:#9E7612;--blue:#2E7AB8;--jade:#3BA66B;--pink:#D9628F;--violet:#7A68C9;--hl:rgba(47,143,91,.1);--scrim:rgba(31,51,36,.45);--shadow:rgba(31,51,36,.15);--dot:rgba(47,143,91,.1);color-scheme:light}
:root[data-skin="sunset"]{--bg:#FBEFE3;--sheet:#FFF9F3;--ink:#3A2418;--muted:#8C6A55;--line:#F0D9C6;--line2:#DDBFA6;--seal:#E0632B;--seal-d:#A8441A;--gold:#F0A423;--gold-d:#B37414;--blue:#2F6FD6;--jade:#2E9B62;--pink:#E25586;--violet:#8A5CD6;--hl:rgba(224,99,43,.1);--scrim:rgba(58,36,24,.45);--shadow:rgba(58,36,24,.15);--dot:rgba(224,99,43,.1);color-scheme:light}
:root[data-skin="ocean"]{--bg:#0F1B2D;--sheet:#17263D;--ink:#E6EEF8;--muted:#8FA3C0;--line:#26405F;--line2:#345478;--seal:#FF7A59;--seal-d:#B94C31;--gold:#FFD166;--gold-d:#B89034;--blue:#5FB0FF;--jade:#43D9A0;--pink:#FF8FB8;--violet:#A98BFF;--hl:rgba(95,176,255,.12);--scrim:rgba(0,10,25,.7);--shadow:rgba(0,0,0,.5);--dot:rgba(95,176,255,.08);color-scheme:dark}
:root[data-skin="sakura"]{--bg:#FBEFF3;--sheet:#FFFAFC;--ink:#3B2630;--muted:#8D6C7A;--line:#F1D7E1;--line2:#E0B9C8;--seal:#D9487A;--seal-d:#A1305A;--gold:#E8A531;--gold-d:#A8731A;--blue:#4A78D8;--jade:#3BA66B;--pink:#E0609A;--violet:#9268D6;--hl:rgba(217,72,122,.1);--scrim:rgba(59,38,48,.45);--shadow:rgba(59,38,48,.15);--dot:rgba(217,72,122,.1);color-scheme:light}
:root[data-skin="paper"]{color-scheme:light}
@media (prefers-color-scheme: dark){:root[data-skin="paper"]:not([data-theme="light"]){color-scheme:dark}}
.skin{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:30px;padding:5px 10px;font:700 13px var(--body);cursor:pointer}
.hdr-r{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.who{margin-left:0}
/* 各页面主色 */
.panel-fam .sec2::before,.panel-fam .act .gl{background:var(--pink)} .tabs button[data-tab="fam"][aria-selected="true"]{background:var(--pink)}
.panel-asset .sec2::before{background:var(--gold)} .tabs button[data-tab="asset"][aria-selected="true"]{background:var(--gold-d)}
.panel-stk .sec2::before{background:var(--jade)} .tabs button[data-tab="stk"][aria-selected="true"]{background:var(--jade)}
.panel-map .sec2::before{background:var(--blue)} .tabs button[data-tab="map"][aria-selected="true"]{background:var(--blue)}
.panel-clan .sec2::before{background:var(--violet)} .tabs button[data-tab="clan"][aria-selected="true"]{background:var(--violet)}
.tabs button[data-tab="act"][aria-selected="true"]{background:var(--seal)}
.tabs button[aria-selected="true"]{color:#fff}
.money{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:0 0 10px;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:12.5px;color:var(--muted)}
.money svg.i{color:var(--gold)}
.money b{color:var(--ink);font-family:var(--num)}

.pix{display:block;image-rendering:pixelated}
.avatar{background:var(--bg);overflow:visible}
.avatar .pix{width:54px;height:54px;border-radius:50%}
.cav{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);border:2px solid var(--line);overflow:hidden;display:grid;place-items:center;margin-right:8px}
.ch{align-items:center}.ch b{flex:1;min-width:0}
.tn .pix{flex:none;border-radius:8px;background:var(--bg)}
.hlist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 10px;border:2px solid var(--line);border-radius:12px;background:var(--sheet);cursor:pointer;text-align:left}
.hrow:hover{border-color:var(--ink)}
.hrow .pix{border-radius:8px;background:var(--bg)}
.hrow .hn{display:grid;min-width:0;line-height:1.3}.hrow .hn b,.hrow .hn small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hrow .hn small{font-size:11.5px;color:var(--muted)}
.hrow .hg{font-weight:900;color:var(--seal);display:grid;justify-items:end;line-height:1.1}.hrow .hg small{font-family:var(--num);font-size:11px;color:var(--muted)}
.lifehead{display:flex;gap:12px;align-items:center;margin-top:8px}.lifehead .pix{border-radius:14px;background:var(--bg);flex:none}.lifehead h3{margin:0}
.tcard.locked{opacity:.55;filter:grayscale(.6);cursor:default;animation:none}.tcard.locked::before{display:none}
.codex .tcard{cursor:default;min-height:96px}.codex .tcard:hover{transform:none}
.reco{padding:10px 12px;display:grid;gap:6px}
.reco-b{border-color:var(--gold-d);background:color-mix(in srgb,var(--gold) 14%,var(--sheet))}

.why{font-style:normal;color:var(--seal);font-weight:700}
.act:disabled .why{opacity:1}
.guide{margin:8px 0 12px;padding-left:22px;display:grid;gap:8px}
.guide li b{display:block}.guide li span{font-size:13.5px;color:var(--muted)}
.era{background:color-mix(in srgb,var(--blue) 14%,transparent);border-left:3px solid var(--blue);padding:3px 8px;border-radius:6px;font-weight:700}
.pixmap{display:block;width:100%;height:auto;border-radius:10px}
.pixmap .sea{fill:#9CC6E6}.pixmap .land{fill:#CFE3A8}.pixmap .river{stroke:#6FA8D6;stroke-width:1.6}

function wheel(title,note,segs,opt={}){
  const boost=opt.boost||1;
  segs=segs.map(s=>{let m=1;if(S.flags.luck)m*=s.g>0?1.8:s.g<0?.55:1;if(S.luck)m*=luckMul(s.g)*persMul(s.g);if(s.g>0)m*=boost;return {...s,w:Math.max(0,s.w)*m}}).filter(s=>s.w>0.0001);
  if(!segs.length)segs=[{label:'平平无奇',w:1,g:0}];
  const tot=segs.reduce((a,s)=>a+s.w,0);let c=0;
  segs.forEach(s=>{s.p=s.w/tot;s.a0=c;c+=s.p;s.a1=c});
  return new Promise(res=>{
    openSheet(`<p class="sk">命运转盘</p><h3>${title}</h3>${note?`<p class="note">${note}</p>`:''}
      <div class="wheelbox"><div class="pointer"></div><canvas id="wc"></canvas><div class="hub">命</div></div>
      <div id="wr"></div><button class="btn primary big" id="spin">转动转盘</button>
      <ul class="legend">${segs.map((s,i)=>`<li data-i="${i}"><i style="background:var(--w${i%8+1})"></i><span>${s.label}</span><b>${(s.p*100).toFixed(s.p<.1?1:0)}%</b></li>`).join('')}</ul>`);
    const cv=$('#wc'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,size=Math.min(280,Math.max(200,innerWidth-90));
    cv.width=size*dpr;cv.height=size*dpr;cv.style.width=cv.style.height=size+'px';ctx.scale(dpr,dpr);
    const cs=getComputedStyle(document.documentElement),cols=[1,2,3,4,5,6,7,8].map(i=>cs.getPropertyValue('--w'+i).trim()),edge=cs.getPropertyValue('--sheet').trim(),T=Math.PI*2;
    function draw(rot){const cc=size/2;ctx.clearRect(0,0,size,size);
      segs.forEach((s,i)=>{const a0=rot+s.a0*T-Math.PI/2,a1=rot+s.a1*T-Math.PI/2;
        ctx.beginPath();ctx.moveTo(cc,cc);ctx.arc(cc,cc,cc,a0,a1);ctx.closePath();ctx.fillStyle=cols[i%8];ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
        if(s.p>.04){ctx.save();ctx.translate(cc,cc);ctx.rotate((a0+a1)/2);ctx.fillStyle='#fff';ctx.font=`600 ${s.p>.12?14:12}px "Noto Sans SC",sans-serif`;
          ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(s.label.slice(0,6),cc-12,0);ctx.restore()}})}
    let rot=0,spun=false,fin=false;draw(0);
    const btn=$('#spin');
    const go=()=>{if(spun)return;spun=true;btn.disabled=true;btn.textContent='转动中…';sfx('spin');
      const s=pickW(segs),idx=segs.indexOf(s),mid=(s.a0+s.p*(.2+.6*R()))*T,target=(RM?0:6)*T+((-mid%T)+T)%T;
      const dur=RM?150:(auto?SPD.spin[speed]:3000),st=performance.now();
      const raf=f=>document.hidden?setTimeout(()=>f(performance.now()),50):requestAnimationFrame(f);
      const step=t=>{const k=Math.min(1,(t-st)/dur);rot=target*(1-Math.pow(1-k,4));draw(rot);if(k<1)raf(step);else done(s,idx)};
      raf(step)};
    const done=(s,idx)=>{sfx(s.g>0?'good':s.g<0?'bad':'flat');sheet.querySelector(`.legend li[data-i="${idx}"]`)?.classList.add('hit');
      $('#wr').innerHTML=`<div class="res"><span class="sk">结果</span><b>${s.label}</b>${s.d?`<p>${s.d}</p>`:''}</div>`;
      btn.disabled=false;btn.textContent='继续';btn.onclick=()=>{if(fin)return;fin=true;closeSheet();res(s)};
      if(auto)setTimeout(()=>btn.onclick(),SPD.hold[speed])};
    btn.onclick=go;if(auto)setTimeout(go,SPD.start[speed]);
  });
}

/* ---------- 面板：本年 ---------- */
function panelAct(){
  const L=curLines();
  const g=(title,ids,note)=>{const h=ids.map(x=>actBtn(x)).join('');return h?`<div class="grp"><h3 class="sec2">${title}${note?`<small>${note}</small>`:''}</h3><div class="acts">${h}</div></div>`:''};
  const fam=[];
  if(S.parents.some(p=>p.alive)&&S.age>=3)fam.push(`陪父母`);if(S.partner)fam.push(married()?'陪伴侣':'约会');if(kidsAlive().length)fam.push('陪孩子');
  return `<div class="paper yearcard yc-main">${yearCardHTML()}</div>
    <p class="tip">还剩 ${S.en}/${S.enMax} 点精力，用完点“下一年”。</p>
    ${S.enMax===0?'<p class="tip">你还太小，只能吃饭睡觉长身体。点“下一年”继续。</p>':''}
    ${(()=>{const rc=recommend().filter(([id,,t])=>avail(id,t)===true);return rc.length?`<div class="paper reco"><span class="lab">本年建议</span><div class="minis">${rc.map(([id,why,t])=>`<button class="mini reco-b" data-a="${id}"${t!=null?` data-t="${t}"`:''}><b>${typeof ACT[id].n==='function'?ACT[id].n(t):ACT[id].n}</b> · ${why}</button>`).join('')}</div></div>`:''})()}
    ${S.wish&&wishOf()?`<div class="paper wishcard"><span class="lab">心愿</span><b>${S.wish.n}</b><span>${fmtW(wishOf().p)} · 已惦记 ${S.age-S.wish.since} 年${S.age-S.wish.since>=3?' · 再不圆就要淡了':''}</span></div>`:''}
    ${S.age>=3?bodyCardHTML():''}
    ${g('校园',['uniLife'])}
    ${g('自我',['study','play','hobby','hobbyGig','body','gym','cure','beauty','therapy','relax','travel'])}
    ${g('事业',['work','jobhunt','famBiz','ot','party','side','stream','kaogong','kaoyan','startup','coStep','coSell','coClose','quit'])}
    ${g('生活',['wish','shop','rentHome','moveOwn','paAsk','buyCar','fortune','will'])}
    ${g('理财',['research','invest','lottery'])}
    ${fam.length?`<p class="tip">${fam.join('、')}在“家庭”页；买房卖房在“资产”页；买卖股票在“股市”页；搬家和出国在“地图”页；族谱和兄弟姐妹在“家族”页。</p>`:''}`;
}

  if(a>=16){if(S.st.str>=10)e++;if(S.hp<40)e--;if(S.parents.some(p=>p.alive&&p.care==='self'))e--;if(a>=75)e--}
  if(a>=16){e+=S.bonusEn||0;S.bonusEn=0;if(curRent()==='near'&&S.job&&R()<.5)e++}
  if(S.jail>0)e=0;
  S.enMax=Math.max(0,e);S.en=S.enMax;
}

/* ================= 一年 ================= */
async function nextYear(){
  if(busy||!S.alive)return;
  if(!auto&&S.en>0&&S.age>=16&&!S.flags.noSkipAsk){busy=true;setBar();
    const c=await choose('还有精力没用',`还剩 ${S.en} 点精力，直接过年就浪费了。`,[{label:'算了，先去用掉',k:'n'},{label:'直接过年',k:'y'},{label:'直接过年，以后别再提醒',k:'never'}]);
    busy=false;if(c.k==='never')S.flags.noSkipAsk=1;if(c.k==='n'){setBar();return}}
  busy=true;setBar();const startAge=S.age;if(S.job&&S.job.track)S.prevJob={...S.job};
  try{
    if(auto)await autoPlay();
    await resolveYear();
    S.hist.push({a:S.age,n:net(S),h:S.st.happy});
    S.age++;newYearLog();S.yr={};sfx('year');
    await milestones();
    if(S.alive){if(!S.jail){jobEvent();cityEvent();await randomEvent()}quoteTick();deathCheck()}
    if(S.alive)setEnergy();
  }catch(e){
    console.error(e);if(S.age===startAge){S.age++;newYearLog();S.yr={}}S.pending=S.pending&&S.pending.age<=S.age?null:S.pending;
    if(S.alive){setEnergy();log('这一年发生了一些说不清的事，日子照常过去了。','dim')}closeSheet();
  }finally{busy=false}
  renderAll();yearToast();queueSave();
  if(!S.alive)finish();
}
async function milestones(){
  const a=S.age;
  if(a===3)log(S.st.money>=6?'你进了一所双语幼儿园，每天学 ABC。':'你上了家附近的幼儿园。');
  if(a===6)await primary();
  if(a===12&&S.stage==='school'){const cs=cshort(S.city);S.schName=[`${cs}乡镇中学`,`${cs}第${['二','五','十一'][ri(0,2)]}中学`,`${cs}外国语学校`,`${cs}国际学校初中部`][S.schoolQ];log(`小学毕业，你升入了<b>${S.schName}</b>。`)}
  if(a===15&&S.stage==='school')await zhongkao();
  if(S.pending&&S.pending.age===a){const p=S.pending;S.pending=null;await PEND[p.type](p)}
  if(!S.alive)return;
  if(S.flags.hidden&&a===25){const g=ri(300,3000);log(`一位律师找上门：一位素未谋面的远房亲戚把 ${fmtW(g)} 遗产留给了你。`+apply({cash:g,happy:3}),'gold')}
  if(S.flags.lottery&&a===S.lotteryAge){S.flags.won=1;log('你随手买了一张彩票，中了 500 万头奖！'+apply({cash:500,happy:3}),'gold')}
  lawTick();if(S.jail)return;
  reviewTick();await dilemmaTick();
  if(S.co&&!S.co.listed&&!S.co.retired)await coYear();
  if(a>=26&&a<=58&&(a-26)%4===0&&S.job&&S.job.kind!=='retired')await career();
  if(a===50||a===66)await health();
  if(S.flags.baosong&&a===18&&S.pending&&S.pending.type==='gaokao'&&!S.once.bs){S.once.bs=1;const c=await choose('保送资格','凭竞赛奖项，你可以直接保送一所 985。',[{label:'接受保送',k:'y'},{label:'参加高考冲清北',k:'n'}],0);if(c.k==='y'){S.pending=null;const t=TIERS[1],sc=[...pick(t.pool)];sc[0]=sname(sc[0]);honor(12,`${S.name}保送${sc[0]}`);await pickMajor(false);enroll(sc[0],sc[1],6,'bachelor',4)}}
  if(a===(S.flags.retire63?63:60))retire();
  if([26,30,35].includes(a)&&!S.partner&&!S.flags.solo&&S.parents.some(p=>p.alive)){S.parents.forEach(p=>p.rel=clamp(p.rel-4,0,100));log(a>=35?'父母已经不催你结婚了，只是叹气。':'过年回家，七大姑八大姨轮番催婚。'+apply({happy:-1}))}
  if(S.age>=60&&kidsAlive().length){const avg=kidsAlive().reduce((x,k)=>x+k.rel,0)/kidsAlive().length;
    if(avg>=65&&R()<.35)log('孩子们常回来看你，家里热热闹闹。'+apply({happy:1}));else if(avg<30&&R()<.35)log('孩子们很少回家，你常常一个人吃饭。'+apply({happy:-1}))}
  if(!S.job&&!S.co&&S.stage==='idle'&&a>=16&&a<60&&!isDep())await PEND.jobhunt();
}

function enroll(sch,city,rank,type,yrs,abroad){

}
function deathCheck(){

async function autoPlay(){
  let guard=0;
  while(S.en>0&&guard++<8&&S.alive){
    const ad=isAdult(),p=S.partner,ks=kidsAlive();let id=null,t;
    const need=(x,tt)=>avail(x,tt)===true;
    if(S.age<18||S.stage==='uni'){id=S.age>=7&&R()<.7?'study':S.age>=10&&R()<.4?'gym':'play';if(!need(id))id=need('study')?'study':need('play')?'play':need('gym')?'gym':null}
    else{
      const lowP=S.parents.findIndex(x=>x.alive&&x.rel<45),lowK=ks.length?S.kids.indexOf(ks.reduce((a,b)=>a.rel<b.rel?a:b)):-1;
      const down=Math.round(C().price*S.pidx[S.city]*.3);
      if(B()&&(bmi()>=26||bmi()<17.5)&&need('body')&&R()<.6)id='body';
      else if(S.hp<55&&need('gym'))id='gym';
      else if(!p&&ad&&S.age<45&&need('date'))id='date';
      else if(p&&!p.married&&p.love>=50&&need('propose'))id='propose';
      else if(p&&!p.married&&need('pDate'))id='pDate';
      else if(married()&&ks.length<2&&mother().age<=40&&S.age>=25&&need('baby'))id='baby';
      else if(married()&&p.love<45&&need('pComp'))id='pComp';
      else if(lowK>=0&&S.kids[lowK].rel<55&&need('kComp',lowK)){id='kComp';t=lowK}
      else if(lowP>=0&&need('paComp',lowP)){id='paComp';t=lowP}
      else if(ad&&!ownsIn(S.city)&&S.cash>down*1.3&&S.age>=26&&need('buyHouse')){await autoBuy();continue}
      else if(ad&&S.cash>80&&!S.yr.autoInv&&R()<.35){await autoInvest();continue}
      else if(S.job&&need('work')&&R()<.7)id='work';
      else if(S.job&&S.job.kind!=='retired'&&R()<.4&&need('ot'))id='ot';
      else id=pick(['gym','study','travel','relax'].filter(x=>need(x)))||null;
    }
    if(!id)break;
    await exec(id,t);
  }
}
async function autoBuy(){

}

function drawChart(cv){

  const a0=h[0].a,L=48,RP=10,maxA=Math.max(a0+1,S.age),X=a=>L+(W-L-RP)*(a-a0)/(maxA-a0);
  const sl=v=>Math.sign(v)*Math.log10(1+Math.abs(v));

  x.font='11px "Noto Sans SC",sans-serif';x.textBaseline='middle';x.lineWidth=1;

  [-1000,-100,-10,0,10,100,1000,10000,100000].filter(t=>sl(t)>=lo&&sl(t)<=hi).forEach(t=>grid(Y1(sl(t)),fmtW(t)));

  const line=(Y,key,col)=>{x.strokeStyle=col;x.lineWidth=2;x.lineJoin='round';x.beginPath();h.forEach((p,i)=>{const yy=Y(key(p));i?x.lineTo(X(p.a),yy):x.moveTo(X(p.a),yy)});x.stroke();

}

  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline class="${h[h.length-1]>=h[0]?'u':'d'}" points="${pts}"/></svg>`;
}

function recommend(){

  if(B()&&S.age>=16&&bmi()>=27)R_.push(['body',`BMI ${bmi()}，该减减肥了`]);
  if(B()&&S.age>=8&&S.age<=17&&!S.yr.sport)R_.push(['play','正在长个子，多运动能长高']);
  if(S.st.happy<=3)R_.push(['therapy','快乐太低，去看看心理医生']);
  if(isAdult()&&!S.job&&!S.co&&S.stage!=='retired')R_.push(['jobhunt','没有工作，先找一份']);
  if(isAdult()&&!p&&!S.flags.solo&&S.age>=22&&S.age<=40)R_.push(['date','单身中，去相个亲']);
  if(p&&!p.married&&p.love>=45)R_.push(['propose','感情到位了，可以求婚']);
  if(married()&&p.love<40)R_.push(['pComp',spouseWord()+'感情下滑，多陪陪']);
  const lp=S.parents.findIndex(x=>x.alive&&x.rel<40);if(lp>=0)R_.push(['paComp',S.parents[lp].role+'感情偏低',lp]);
  const lk=S.kids.findIndex(k=>k.alive&&k.rel<45);if(lk>=0)R_.push(['kComp',S.kids[lk].name+'和你疏远了',lk]);
  if(isAdult()&&!ownsIn(S.city)&&S.cash>C().price*S.pidx[S.city]*.4&&S.age>=25)R_.push(['buyHouse','存款够首付了，考虑买房']);
  if(S.age>=18&&S.cash>50&&portV(S)<S.cash*.2)R_.push(['research','现金闲着，可以看看股市']);
  if(S.job&&WORK[S.job.kind]&&!S.yr.work)R_.push(['work','安排一下今年的工作']);
  if(conds().length&&S.cash>=5)R_.push(['cure',`有${COND[conds()[0]].n}，该治了`]);
  if(!S.hobby&&S.age>=12)R_.push(['hobby','还没有爱好，培养一个']);
  if(inSchool()&&!S.yr.studied)R_.push(['study',acad()<50?`学业只有 ${acad()}，再不学就掉队了`:'今年还没学习，学业会下滑']);
  return R_.slice(0,3);
}

  if(e.fire){log(e.t+apply({happy:-2}),'bad');S.job=null;S.stage='idle';return}
  if(e.promo)S.job.promo=(S.job.promo||0)+e.promo;if(e.fame)honor(e.fame,null);
  log(e.t.replace('陆家嘴',CBD[S.city]||'CBD')+apply(e.f?e.f(S):e.d));
}

function whyNot(id,t){
  const a=ACT[id];if(!a)return '';if(S.jail>0)return '服刑中';
  if(a.once&&S.yr[id+(t??'')])return '今年已做过';
  if(S.en<(a.en||0))return '精力不够';
  const c=a.cost?a.cost(t):0;if(c>0&&S.cash<c)return `差 ${fmtW(c-S.cash)}`;
  if(a.ok&&!a.ok(t))return a.okWhy?(typeof a.okWhy==='function'?a.okWhy(t):a.okWhy):'条件不满足';
  return '';
}

function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}

function landCells(){if(landCache)return landCache;const a=[];for(let lat=MAP.lat1;lat>MAP.lat0;lat-=MAP.cell)for(let lon=MAP.lon0;lon<MAP.lon1;lon+=MAP.cell){const cx=lon+MAP.cell/2,cy=lat-MAP.cell/2;if(inPoly(cx,cy,CN_POLY)||ISLES.some(p=>inPoly(cx,cy,p)))a.push([lon,lat])}return landCache=a}

function panelMap(){

  const W=320,H=(MAP.lat1-MAP.lat0)/MAP.cell*ch+8;
  const own=new Set(S.houses.map(h=>h.city)),kc=new Set(kidsAlive().filter(k=>k.age>=18).map(k=>k.city));

  svg+=`<rect x="0" y="0" width="${W}" height="${H}" class="sea"/>`;
  landCells().forEach(([lon,lat])=>{const sh=((lon*7+lat*13)%5)/40;svg+=`<rect x="${px(lon).toFixed(1)}" y="${py(lat).toFixed(1)}" width="${cw+.3}" height="${ch+.3}" class="land" style="opacity:${(.85+sh).toFixed(2)}"/>`});
  const rivers=[[[104,33],[108,32],[112,30.5],[115,29.8],[118,31],[121.5,31.2]],[[101,36],[106,38],[110,38],[112,35],[114.5,36],[117,37.3],[119,37.5]]];
  rivers.forEach(r=>{for(let i=1;i<r.length;i++){const a=r[i-1],b=r[i];svg+=`<line x1="${px(a[0])}" y1="${py(a[1])}" x2="${px(b[0])}" y2="${py(b[1])}" class="river"/>`}});
  svg+=`<text class="sea-t" x="${px(123)}" y="${py(35)}">黄海</text><text class="sea-t" x="${px(124)}" y="${py(28)}">东海</text><text class="sea-t" x="${px(113)}" y="${py(19.6)}">南海</text>`;
  const cx=CITIES[S.city];
  if(cx.t<4)own.forEach(c=>{if(c!==S.city&&CITIES[c].t<4){const o=CITIES[c];svg+=`<line class="link" x1="${px(cx.lon)}" y1="${py(cx.lat)}" x2="${px(o.lon)}" y2="${py(o.lat)}"/>`}});
  CIDS.filter(id=>CITIES[id].t<4).forEach(id=>{const c=CITIES[id],x=px(c.lon),y=py(c.lat),cur=id===S.city;
    const floors=c.t===1?4:c.t===2?3:1,bw=c.t===1?12:c.t===2?10:8,bh=floors*4;
    svg+=`<g class="city${cur?' cur':''}${id===sel?' sel':''}">`;
    svg+=`<rect x="${x-bw/2}" y="${y-bh}" width="${bw}" height="${bh}" class="bld"/>`;
    for(let f=0;f<floors;f++)for(let w=0;w<Math.floor(bw/4);w++)svg+=`<rect x="${x-bw/2+1+w*4}" y="${y-bh+1+f*4}" width="2" height="2" class="win"/>`;
    if(c.t===1)svg+=`<rect x="${x-1}" y="${y-bh-5}" width="2" height="5" class="bld"/>`;
    if(id==='home')svg+=`<polygon points="${x-6},${y-4} ${x},${y-9} ${x+6},${y-4}" class="roof"/>`;
    if(own.has(id))svg+=`<rect x="${x+bw/2+1}" y="${y-5}" width="4" height="4" class="own"/>`;

    <p class="cs">${CITY_DESC[sel]||''}${c.tag?' · '+c.tag:''}</p>

    <div><dt>你的房产</dt><dd>${mine} 套</dd></div><div><dt>房价走势</dt><dd class="${S.pidx[sel]>=1?'up':'dn'}">${S.pidx[sel]>=1?'+':''}${Math.round((S.pidx[sel]-1)*100)}%</dd></div>${c.t===4?`<div><dt>留学学费</dt><dd>${OVU[sel].tu} 万/年</dd></div><div><dt>当地名校</dt><dd style="white-space:normal;font-size:12px">${OVU[sel].top.slice(0,3).join('、')}</dd></div>`:''}</dl>
    ${kids.length?`<p class="tip">${kids.join('、')}在这里生活。</p>`:''}
    <div class="minis">${miniBtn('move',sel)}${isAdult()?miniBtn('buyHouse',sel,`在${cn(sel)}买房`):''}</div></div></div>`;

/* ================= 身体系统：身高 · 体重 · 颜值 ================= */
const nrm=(m,sd)=>m+sd*gauss();
const HFRAC=[.30,.44,.51,.56,.60,.63,.66,.69,.72,.75,.78,.81,.85,.89,.93,.96,.98,.99,1];
const hfrac=(age,g)=>{age=Math.max(0,age);const a=g==='女'&&age>6?age+Math.min(1.5,(age-6)*.3):age;if(a>=18)return 1;const i=Math.floor(a),f=a-i;return HFRAC[i]+(HFRAC[Math.min(18,i+1)]-HFRAC[i])*f};
const bmiBase=age=>age<2?17:age<6?15.5:age<10?16.5:age<14?18.5:age<18?20.5:22;
const B=()=>S.body;
function mkBody(g,fa,mo,tier,bonus){
  const fh=fa||nrm(172,6)+(tier>=6?2:tier<=2?-2:0),mh=mo||nrm(160,5)+(tier>=6?1.5:tier<=2?-1.5:0);
  const mid=g==='男'?(fh+mh+13)/2:(fh+mh-13)/2;

function lawTick(){
  if(S.jail>0){S.jail--;S.parents.forEach(p=>{if(p.alive)p.rel=clamp(p.rel-4,0,100)});kidsAlive().forEach(k=>k.rel=clamp(k.rel-5,0,100));
    if(S.jail===0){S.stage='idle';S.flags.exCon=1;log('你刑满释放了。走出监狱大门，外面的世界变了很多。'+apply({happy:2}),'ms')}
    else log(`你在监狱里又过了一年，还剩 ${S.jail} 年。`+apply({happy:-1,hp:-2}),'bad');
    if(married()&&R()<.25){log(`${spouseWord()}${S.partner.name}受不了了，提出离婚。`,'bad');S.partner=null;S.inlaws=null;S.everMarried=true;S.flags.divorced=1}
    return}
  if(!S.dirty)return;
  const p=Math.min(.5,.035*S.dirty*(S.job&&['gov','police'].includes(S.job.kind)?1.5:1)*(S.netw>=5?.7:1));
  if(R()<p){
    const yrs=S.dirty>=6?ri(5,12):S.dirty>=3?ri(1,5):0,fine=Math.round(S.dirty*8+Math.max(0,S.cash)*.3);
    S.flags.caught=1;S.fame=Math.max(0,(S.fame||0)-20);
    const ret=S.job&&S.job.kind==='retired';log(`东窗事发！${ret?'退休前':S.job?S.job.name+'任上的':''}问题被查了出来。没收违法所得，罚款 ${fmtW(fine)}。`+apply({cash:-fine,happy:-5}),'bad');
    if(S.job&&S.job.kind!=='retired'){S.job=null;S.co=null}
    if(yrs){S.jail=yrs;S.stage='jail';S.flags.jailed=1;log(`你被判处有期徒刑 ${yrs} 年。`,'bad')}else if(ret){S.job.salary=r1(S.job.salary*.5);log('退休待遇被取消了一半。','bad')}else{S.stage='idle';log('你被开除了，档案上留下了处分。','bad')}
    S.dirty=0;
  }else if(R()<.1)S.dirty=Math.max(0,S.dirty-1);
}

    if(isAdult()&&f.age>=22)ev.push(async()=>{const amt=ri(3,20);const c=await choose(`${f.name}找你借钱`,`说是${pick(['家里老人住院','做生意周转','买房差首付'])}，要借 ${amt} 万。`,[{label:'借',k:'y',dis:S.cash<amt},{label:'婉拒',k:'n'}],S.cash>amt*4?0:1);

      else{f.rel=clamp(f.rel-8,0,100);log(`你没借钱给${f.name}，对方嘴上说没事。`)}});
    if(isAdult()&&S.age>=25&&S.age<=45&&!S.co&&S.stage!=='retired')ev.push(async()=>{const c=await choose(`${f.name}拉你合伙创业`,`“我们一起干，我出技术/资源，你出点钱和人。”挚友合伙，成功率更高，但也可能伤感情。`,[{label:'一起干',k:'y'},{label:'不了',k:'n'}],1);
      if(c.k==='y'){S.flags.biz2=S.flags.biz;S.flags.biz=1;f.cof=1;log(`你答应和${f.name}合伙创业。`);const r=await startup(true);S.flags.biz=S.flags.biz2;if(r==='cancel')log('最后你还是没下决心。')}else log(`你婉拒了${f.name}的合伙邀请。`)});
    if(isAdult()&&!S.partner&&!S.flags.solo&&S.age>=22&&S.age<=40)ev.push(async()=>{S.partner=mkPartner(R()<.15);S.partner.love=45;log(`${f.name}给你介绍了${S.partner.name}（${S.partner.job}），你们开始交往。`+apply({happy:2}),'ms')});
    if(S.cash<0&&isAdult())ev.push(async()=>{const g=ri(3,15);log(`知道你手头紧，${f.name}二话不说转了你 ${g} 万：“不急着还。”`+apply({cash:g,happy:1}),'gold');S.loans=(S.loans||[]).concat([{from:f.name,amt:g,due:S.age+4}])});
    if(isAdult()&&!S.job&&S.stage==='idle')ev.push(async()=>{S.flags.huntBonus=1;log(`${f.name}帮你内推了几个岗位，下次找工作更容易。`)});
    ev.push(async()=>{f.rel=clamp(f.rel+5,0,100);log(`你和${f.name}${pick(['一起去自驾游','通宵看球','回母校走了一圈','在大排档聊到天亮'])}。`+apply({happy:2}))});
    await pick(ev)()}
  // 兄弟姐妹
  for(const b of sibsAlive()){
    if(b.rel<=10&&!b.cut&&S.age>=18){b.cut=1;log(`你和${b.name}已经好几年没说过话了，过年也不再一起吃饭。`+apply({happy:-1}),'bad');continue}
    if(b.rel>=80&&R()<.2&&S.age>=18){

      else if(kidsAlive().some(k=>k.age<6)){S.bonusEn=(S.bonusEn||0)+1;log(`${b.name}主动帮你带孩子，你轻松了一点（明年精力 +1）。`)}
      else if(S.parents.some(p=>p.alive&&p.care)){S.parents.forEach(p=>{if(p.alive)p.hp=clamp(p.hp+5,0,100)});log(`${b.name}和你轮流照顾老人，你没那么累了。`)}
      else log(`${b.name}${pick(['寄来了老家的特产','约你一起回老家扫墓','在你生日那天打来电话'])}，手足情深。`+apply({happy:1}))}}
  // 父母
  for(const p of S.parents.filter(x=>x.alive)){
    if(p.rel>=90&&R()<.15&&S.age>=18){if(kidsAlive().some(k=>k.age<6)){S.bonusEn=(S.bonusEn||0)+1;log(`${p.role}过来帮你带孩子（明年精力 +1）。`)}else log(`${p.role}${pick(['包了你最爱吃的饺子送过来','给你织了件毛衣','打电话叮嘱你按时吃饭'])}。`+apply({happy:1}))}
    if(p.rel<=15&&!p.cold&&S.age>=16){p.cold=1;log(`${p.role}对你心寒了，电话也很少打了。`+apply({happy:-1}),'bad')}
    if(p.rel>=40)p.cold=0}
  // 伴侣
  const sp=S.partner;
  if(sp&&sp.married&&sp.love>=88&&R()<.2)log(`${pick([`结婚纪念日，${sp.name}给你准备了惊喜。`,`${sp.name}默默把你爱吃的菜做了一桌。`,`你生病那几天，${sp.name}请假在家照顾你。`])}`+apply({happy:2}),'gold');
  // 成年子女
  for(const k of kidsAlive().filter(k=>k.age>=22&&!k.away)){
    if(k.rel>=85&&R()<.15){if(S.age>=55&&k.cash>5){const g=r1(Math.min(k.cash*.15,50));k.cash-=g;log(`${k.name}给你打了 ${fmtW(g)}：“爸妈辛苦了，这钱拿去花。”`+apply({cash:g,happy:2}),'gold')}else log(`${k.name}${pick(['带你去吃了顿好的','给你买了新手机','陪你去体检'])}。`+apply({happy:1}))}
    else if(k.rel<=20&&R()<.2)log(`${k.name}过年又没回家，电话里也没几句话。`+apply({happy:-1}),'bad')}
}

/* ================= 运势 v2：好运 / 平运 / 坏运 ================= */
const LUCK={good:{n:'好运',c:'jade'},flat:{n:'平运',c:'muted'},bad:{n:'坏运',c:'seal'}};
function mkLuck(){
  // 命格：有人天生运气好，一连几十年好运；有人反之
  const fate=pickW([{k:'lucky',w:S.flags.luck?45:18},{k:'normal',w:54},{k:'rough',w:S.flags.luck?6:22},{k:'swing',w:6}]).k;
  const P={lucky:[.6,.3,.1],normal:[.32,.4,.28],rough:[.12,.33,.55],swing:[.45,.1,.45]}[fate];
  const st=ri(1,10),seq=[];
  for(let i=0;i<11;i++){const r=R();seq.push({t:r<P[0]?'good':r<P[0]+P[1]?'flat':'bad'})}
  return {st,seq,fate,known:0};
}
function luckAt(age){const L=S&&S.luck;if(!L)return null;if(age<L.st)return {t:'flat',i:-1,a0:0,a1:L.st-1,child:1};
  const i=Math.min(L.seq.length-1,Math.floor((age-L.st)/10));return {t:L.seq[i].t,i,a0:L.st+i*10,a1:L.st+i*10+9}}
const luckNow=()=>luckAt(S.age);
const luckName=l=>l.child?'童年':LUCK[l.t].n;
function luckMul(g){const l=S&&S.luck&&luckNow();if(!l||!g)return 1;if(l.t==='good')return g>0?1.4:.7;if(l.t==='bad')return g<0?1.45:.75;return 1}
const LHINT={good:['这一年起，你总觉得做什么都顺手，好像有人在暗中帮你。','你连着几次赶上好时机，感觉风向变了。','最近干什么都顺，连抽奖都能中。'],
  bad:['这一年起，喝凉水都塞牙，诸事不顺。','你接连碰上倒霉事，奶奶说你该去庙里拜拜。','你总觉得最近背得很，干什么都差一口气。'],
  flat:['日子回归平淡，不好不坏。','之前的起起落落过去了，生活进入了平稳期。']};
function luckShift(){const a=luckAt(S.age),b=luckAt(S.age+1);if(!a||!b||a.i===b.i||S.age<5)return;
  if(a.t===b.t&&!S.luck.known)return;
  log((S.luck.known?`运势进入新的十年（${b.a0}–${b.a1} 岁）：<b>${LUCK[b.t].n}</b>。`:'')+(a.t===b.t?(b.t==='good'?'好运还在继续。':b.t==='bad'?'倒霉的日子还没到头。':'依旧平平淡淡。'):pick(LHINT[b.t])),b.t==='bad'?'bad':b.t==='good'?'gold':'dim')}
function luckSegs(upto){const L=S.luck;if(!L)return [];const raw=[{t:'flat',child:1,a0:0,a1:L.st-1}].concat(L.seq.map((x,i)=>({t:x.t,a0:L.st+i*10,a1:L.st+i*10+9}))).filter(x=>x.a0<=upto);
  // 相同运势相邻合并，方便看出“连续三十年好运”
  const m=[];for(const x of raw){const p=m[m.length-1];if(p&&!p.child&&!x.child&&p.t===x.t)p.a1=x.a1;else m.push({...x})}return m.map(x=>({...x,a1:Math.min(x.a1,upto)}))}
function luckBarHTML(upto){const segs=luckSegs(upto);if(!segs.length)return '';
  const good=segs.filter(x=>x.t==='good'&&!x.child),bad=segs.filter(x=>x.t==='bad');
  const longest=good.reduce((a,x)=>Math.max(a,x.a1-x.a0+1),0);
  const fate={lucky:'天生好命，这辈子好运多',normal:'普通命格，好坏参半',rough:'命途多舛，坏运偏多',swing:'大起大落，没有平运'}[S.luck.fate]||'';
  return `<div class="luckbar">${segs.map(x=>`<div class="lk lk-${x.child?'child':x.t}" style="flex:${x.a1-x.a0+1}"><b>${x.child?'童年':LUCK[x.t].n}</b><span>${x.a0}–${x.a1} 岁</span></div>`).join('')}</div>
    <p class="tip">${fate}。${good.length?`好运：${good.map(x=>`${x.a0}–${x.a1}`).join('、')} 岁${longest>=30?`，最长一连 ${longest} 年`:''}。`:'这辈子没走过好运。'}${bad.length?` 坏运：${bad.map(x=>`${x.a0}–${x.a1}`).join('、')} 岁。`:' 没碰上坏运。'}好运时转盘好结果更容易，坏运时坏结果更容易。</p>`}
function luckLine(){if(!S.luck||!S.luck.known)return '未知（可以找人算命）';const l=luckNow();return `${luckName(l)}（${l.a0}–${l.a1} 岁）`}

};
async function pickGoal(){
  const c=await choose('你想过怎样的一生？','志向会给你一点专属加成；达成志向的人生，结算评分 +15，还会记入家族史。不想赚钱也能过得很好。',
    Object.entries(GOALS).map(([k,g])=>({label:g.n,sub:`${g.d} · ${g.perk}`,k})),ri(0,5));
  S.goal=c.k;log(`你给自己定下了人生志向：<b>${GOALS[c.k].n}</b>——${GOALS[c.k].d}。`,'ms');
}
async function goalTick(){
  if(!S.goal){if(S.age>=18&&!S.once.goalAsk&&S.alive){S.once.goalAsk=1;await pickGoal()}return}
  const g=S.goal;
  if(g==='wealth'&&S.cash>0)S.cash=r1(S.cash*1.01);
  if(g==='family'){kidsAlive().forEach(k=>k.rel=clamp(k.rel+1,0,100));if(S.partner)S.partner.love=clamp(S.partner.love+1,0,100)}
  if(g==='free'&&S.st.happy<5&&R()<.5)S.st.happy++;
  if(g==='scholar'&&S.acad!=null&&['school','uni'].includes(S.stage))S.acad=clamp(S.acad+2,0,100);
  if(g==='health')S.hp=clamp(S.hp+1,0,100);
  if(!S.flags.goalDone&&GOALS[g].prog()>=1){S.flags.goalDone=1;honor(10,`${S.name}达成志向「${GOALS[g].n}」`);log(`你达成了年轻时定下的志向：<b>${GOALS[g].n}</b>。${pick(['回头看，这一路走得值。','你给自己倒了杯酒。','那一刻你很平静。'])}`+apply({happy:3}),'gold')}
}
function goalLine(){if(!S.goal)return '';const g=GOALS[S.goal];return `${g.n} ${Math.round(g.prog()*100)}%${S.flags.goalDone?' ✓':''}`}

/* ================= 音乐与音效（WebAudio 合成，无外部文件） ================= */
const AUD={ctx:null,bgm:false,sfx:true,timer:null,step:0,gain:null};
(()=>{try{const p=JSON.parse(localStorage.getItem('life-audio')||'{}');if(typeof p.bgm==='boolean')AUD.bgm=p.bgm;if(typeof p.sfx==='boolean')AUD.sfx=p.sfx}catch(e){}})();
function audSave(){try{localStorage.setItem('life-audio',JSON.stringify({bgm:AUD.bgm,sfx:AUD.sfx}))}catch(e){}}
function audCtx(){if(!AUD.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;AUD.ctx=new AC();AUD.gain=AUD.ctx.createGain();AUD.gain.gain.value=.16;AUD.gain.connect(AUD.ctx.destination)}if(AUD.ctx.state==='suspended')AUD.ctx.resume().catch(()=>{});return AUD.ctx}
function tone(f,t0,dur,type,vol,dest){const c=AUD.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.5,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(dest||AUD.gain);o.start(t0);o.stop(t0+dur+.02)}
/* 音效 */
const SFX={
  click(){const c=audCtx();if(!c)return;tone(880,c.currentTime,.05,'square',.25)},
  tick(){const c=audCtx();if(!c)return;tone(1400,c.currentTime,.03,'square',.15)},
  good(){const c=audCtx();if(!c)return;const t=c.currentTime;[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.18,'square',.3))},
  bad(){const c=audCtx();if(!c)return;const t=c.currentTime;[330,262,196].forEach((f,i)=>tone(f,t+i*.1,.22,'sawtooth',.25))},
  flat(){const c=audCtx();if(!c)return;tone(440,c.currentTime,.12,'triangle',.3)},
  year(){const c=audCtx();if(!c)return;const t=c.currentTime;tone(660,t,.08,'triangle',.3);tone(990,t+.09,.12,'triangle',.3)},
  coin(){const c=audCtx();if(!c)return;const t=c.currentTime;tone(1319,t,.06,'square',.25);tone(1760,t+.06,.12,'square',.25)},
  spin(){const c=audCtx();if(!c)return;const t=c.currentTime;for(let i=0;i<14;i++)tone(900+i*40,t+i*.06*(1+i*.08),.03,'square',.15)},
};
function sfx(k){if(!AUD.sfx||RM)return;try{SFX[k]&&SFX[k]()}catch(e){}}
/* 背景音乐：五声音阶随机生成的小曲，8 分音符循环 */
const PENTA=[0,2,4,7,9,12,14,16];
function bgmLoop(){
  const c=AUD.ctx;if(!c||!AUD.bgm)return;
  const bpm=96,beat=60/bpm,t0=c.currentTime+.05,root=AUD.root||(AUD.root=220);
  const bars=4,notes=[];let last=3;
  for(let i=0;i<bars*8;i++){if(i%2===0||Math.random()<.5){last=clamp(last+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)],0,PENTA.length-1);notes.push([i,last])}}
  const dest=AUD.gain;
  notes.forEach(([i,n])=>tone(root*Math.pow(2,PENTA[n]/12),t0+i*beat/2,beat*.45,'triangle',.5,dest));
  for(let b=0;b<bars;b++){const chord=[0,7,4,9][b%4];tone(root/2*Math.pow(2,chord/12),t0+b*beat*2,beat*1.6,'sine',.45,dest);tone(root/2*Math.pow(2,(chord+7)/12),t0+b*beat*2+beat,beat*.8,'sine',.3,dest)}
  for(let i=0;i<bars*8;i+=2)tone(i%8===0?110:80,t0+i*beat/2,.05,'square',.12,dest);
  AUD.timer=setTimeout(bgmLoop,bars*2*beat*1000-80);
}
function bgmSet(on){AUD.bgm=on;audSave();clearTimeout(AUD.timer);AUD.timer=null;if(on){if(audCtx())bgmLoop()}audBtns()}
function audBtns(){const b=$('#bBgm'),s=$('#bSfx');if(b){b.textContent=(AUD.bgm?'♫ 音乐开':'♫ 音乐关');b.classList.toggle('on',AUD.bgm);b.setAttribute('aria-pressed',AUD.bgm)}if(s){s.textContent=AUD.sfx?'♪ 音效开':'♪ 音效关';s.classList.toggle('on',AUD.sfx);s.setAttribute('aria-pressed',AUD.sfx)}}
function audInit(){
  const r=$('#hdr-r')||document.querySelector('.hdr-r');if(!r||$('#bBgm'))return;
  r.insertAdjacentHTML('afterbegin',`<button class="skin aud" id="bBgm" type="button" aria-pressed="false"></button><button class="skin aud" id="bSfx" type="button" aria-pressed="true"></button>`);
  $('#bBgm').onclick=()=>{bgmSet(!AUD.bgm);sfx('click')};$('#bSfx').onclick=()=>{AUD.sfx=!AUD.sfx;audSave();audBtns();sfx('click')};audBtns();
  // 全局按键反馈：所有按钮点击都有轻响；页面被隐藏时暂停音乐
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.id==='bBgm'||b.id==='bSfx')return;sfx(b.classList.contains('opt')||b.id==='bNext'?'tick':'click')},true);
  let once=false;document.addEventListener('pointerdown',()=>{if(once)return;once=true;if(AUD.bgm)bgmSet(true)},{capture:true});
  document.addEventListener('visibilitychange',()=>{if(!AUD.ctx)return;if(document.hidden)AUD.ctx.suspend().catch(()=>{});else if(AUD.bgm)AUD.ctx.resume().catch(()=>{})});
}
